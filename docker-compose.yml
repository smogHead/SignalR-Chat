# Start:      docker compose up --build
# Scale out:  docker compose up --build --scale chat-server=3
# Clients connect to http://<host>:8080 (nginx), which round-robins across replicas.
# The Redis backplane fans messages out so users on different replicas see each other.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-server:
    build:
      context: .
      dockerfile: src/Chat.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: redis:6379,abortConnect=false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (32+ chars)}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No host port: reached via nginx so it can be scaled.

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server
    restart: unless-stopped

volumes:
  redis-data:
